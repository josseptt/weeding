<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Invitados - Boda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8ede8 0%, #d4ddd4 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #5F735F;
    }

    .header p {
      color: #666;
      font-size: 1.1rem;
    }

    .search-box {
      margin-bottom: 30px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 15px 20px;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      border-color: #5F735F;
    }

    .filters {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid #ddd;
      transition: all 0.3s;
      user-select: none;
    }

    .filter-checkbox:hover {
      border-color: #5F735F;
      background-color: #f5f9f5;
    }

    .filter-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #5F735F;
    }

    .filter-checkbox span {
      font-weight: 500;
      color: #333;
    }

    .table-wrapper {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: linear-gradient(135deg, #5F735F 0%, #4a5c4a 100%);
      color: white;
    }

    thead th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    tbody tr {
      border-bottom: 1px solid #f0f0f0;
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background-color: #e8ede8;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }

    tbody tr:nth-child(even):hover {
      background-color: #e8ede8;
    }

    tbody td {
      padding: 15px;
      color: #333;
    }

    .captain-badge {
      display: inline-block;
      background: #7a8f7a;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: 8px;
    }

    .no-drink-badge {
      display: inline-block;
      background: #f44336;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: 8px;
    }

    .patch-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #7a8f7a;
      color: white;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .patch-icons {
      display: flex;
      gap: 2px;
    }

    .couple-info {
      color: #5F735F;
      font-size: 0.9rem;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 1.1rem;
    }

    .results-count {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .filters {
        flex-direction: column;
        gap: 10px;
      }

      .filter-checkbox {
        width: 100%;
        justify-content: center;
      }

      .table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        font-size: 0.8rem;
        min-width: 600px;
      }

      thead th {
        padding: 10px 8px;
        font-size: 0.75rem;
      }

      tbody td {
        padding: 10px 8px;
      }

      .captain-badge,
      .no-drink-badge {
        display: block;
        margin: 5px 0;
        width: fit-content;
      }

      .patch-badge {
        font-size: 0.75rem;
        padding: 4px 8px;
      }

      .couple-info {
        font-size: 0.8rem;
        display: block;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .header p {
        font-size: 0.9rem;
      }

      .search-box input {
        padding: 12px 15px;
        font-size: 0.9rem;
      }

      table {
        font-size: 0.75rem;
        min-width: 500px;
      }

      thead th {
        padding: 8px 5px;
        font-size: 0.7rem;
      }

      tbody td {
        padding: 8px 5px;
      }

      .results-count {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

  var filteredGuests = guests;

  function getPartnerName(coupleId, currentGuestId) {
    if (coupleId === 0) return null;
    var partner = null;
    for (var i = 0; i < guests.length; i++) {
      if (guests[i].coupleId === coupleId && guests[i].id !== currentGuestId) {
        partner = guests[i];
        break;
      }
    }
    return partner ? partner.fullName : null;
  }

  function renderTable(guestsToRender) {
    var tbody = document.getElementById('guestTableBody');
    var noResults = document.getElementById('noResults');

    if (guestsToRender.length === 0) {
      tbody.innerHTML = '';
      noResults.style.display = 'block';
      return;
    }

    noResults.style.display = 'none';

    var html = '';
    for (var i = 0; i < guestsToRender.length; i++) {
      var guest = guestsToRender[i];
      var partnerName = getPartnerName(guest.coupleId, guest.id);

      var badges = '';
      if (guest.captain) {
        badges += '<span class="captain-badge">⭐ CAPITÁN</span>';
      }
      if (guest.noDrink) {
        badges += '<span class="no-drink-badge">🚫 NO ALCOHOL</span>';
      }

      var coupleHtml = partnerName ? '<span class="couple-info">❤️ ' + partnerName + '</span>' : '<span style="color: #999;">Sin pareja</span>';

      var patchHtml = '';
      if (guest.patchCounter > 0) {
        var drinkIcons = '';
        for (var j = 0; j < guest.patchCounter; j++) {
          drinkIcons += '🍺';
        }
        patchHtml = '<span class="patch-badge"><span class="patch-icons">' + drinkIcons + '</span> ' + guest.patchCounter + '</span>';
      } else {
        patchHtml = '<span style="color: #999;">-</span>';
      }

      html += '<tr>';
      html += '<td>' + guest.fullName + ' ' + badges + '</td>';
      html += '<td>Mesa ' + guest.tableNumber + '</td>';
      html += '<td>' + coupleHtml + '</td>';
      html += '<td>' + patchHtml + '</td>';
      html += '<td>' + (guest.notes || '-') + '</td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function filterGuests() {
    var searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    var filterCaptains = document.getElementById('filterCaptains').checked;
    var filterPatches = document.getElementById('filterPatches').checked;

    if (searchTerm === '' && !filterCaptains && !filterPatches) {
      filteredGuests = guests;
    } else {
      filteredGuests = [];
      for (var i = 0; i < guests.length; i++) {
        var matchesSearch = searchTerm === '' || guests[i].fullName.toLowerCase().indexOf(searchTerm) !== -1;
        var matchesCaptain = !filterCaptains || guests[i].captain === true;
        var matchesPatches = !filterPatches || guests[i].patchCounter > 0;

        if (matchesSearch && matchesCaptain && matchesPatches) {
          filteredGuests.push(guests[i]);
        }
      }
    }

    renderTable(filteredGuests);
    updateCounts();
  }

  function updateCounts() {
    document.getElementById('totalGuests').textContent = 'Total de invitados: ' + guests.length;
    document.getElementById('resultsCount').textContent = 'Mostrando ' + filteredGuests.length + ' de ' + guests.length + ' invitados';
  }

  document.getElementById('searchInput').addEventListener('input', filterGuests);
  document.getElementById('filterCaptains').addEventListener('change', filterGuests);
  document.getElementById('filterPatches').addEventListener('change', filterGuests);

  renderTable(guests);
  updateCounts();
</script>
</body>
</html>
